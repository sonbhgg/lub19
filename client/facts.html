<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Факты</title>
    <style>
        body { text-align: center; padding: 50px; }
        .fact { font-size: 24px; margin: 20px; line-height: 1.6; }
        button { background: blue; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: white; color: blue; }
    </style>
</head>
<body>
    <h1>Факты о животных</h1>
    <div id="fact" class="fact"></div>
    <button onclick="showRandomFact()">Получить факт</button>
    
    <script>
        const facts = [
            "У осьминога три сердца!",
            "Слоны — единственные млекопитающие, которые не умеют прыгать",
            "Страусы бегают быстрее лошадей",
            "У кошек более 100 голосовых звуков",
            "Дельфины дают друг другу имена"
        ];
        
        function showRandomFact() {
            const randomFact = facts[Math.floor(Math.random() * facts.length)];
            document.getElementById('fact').textContent = randomFact;
        }
        
        showRandomFact();
    </script>
</body>
</html>
